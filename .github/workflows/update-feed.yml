name: Update Climate & Food Feeds

on:
  schedule:
    - cron: '0 7 * * 5'
      timezone: 'Europe/Zurich'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate feeds
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python src/generate_feed.py

      - name: Commit updated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update climate and food feeds"
            git push
          fi
